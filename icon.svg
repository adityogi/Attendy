<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Calendar Base -->
  <g filter="url(#shadow)">
    <!-- Calendar Card -->
    <rect x="100" y="120" width="312" height="280" rx="36" fill="#ffffff" />
    
    <!-- Calendar Header -->
    <path d="M 100 156 A 36 36 0 0 1 136 120 L 376 120 A 36 36 0 0 1 412 156 L 412 188 L 100 188 Z" fill="#3b82f6" />
    
    <!-- Calendar Rings -->
    <rect x="160" y="96" width="24" height="48" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4" />
    <rect x="328" y="96" width="24" height="48" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4" />

    <!-- Big Checkmark -->
    <path d="M 170 290 L 230 350 L 345 230" fill="none" stroke="#10b981" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 85% CIE Target Badge -->
  <g filter="url(#shadow)">
    <rect x="290" y="340" width="160" height="64" rx="32" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4" />
    <text x="370" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">85% CIE</text>
  </g>
</svg>
